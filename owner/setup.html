<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Setup | Samson's Automation</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../app/styles.css"><link rel="stylesheet" href="../app/clock.css"><link rel="stylesheet" href="owner.css"></head><body class="clock-page"><main class="setup-centered"><section class="clock-card auth-card"><span class="kicker">ONE-TIME SETUP</span><h1>Create Samson's platform owner</h1><p>This is separate from every client administrator. The setup key is stored only as a Cloudflare Worker secret.</p><form id="platformSetupForm" class="clock-form"><label>Platform bootstrap key<input name="setupKey" type="password" required></label><label>Your name<input name="displayName" required></label><label>Owner username<input name="username" required></label><label>Owner password<input name="password" type="password" minlength="10" required></label><button class="primary-button" type="submit">Create owner account</button><div class="form-message" id="setupMessage"></div></form><p class="small-note"><a href="index.html">Return to owner sign-in</a></p></section></main><script src="../app/config.js"></script><script src="../app/clock-api.js"></script><script>const API=window.SamsonsClockAPI,form=document.querySelector('#platformSetupForm'),m=document.querySelector('#setupMessage');form.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Creating…';m.className='form-message info';const f=form.elements;try{await API.request('/api/platform/bootstrap',{method:'POST',body:{setupKey:f.setupKey.value,displayName:f.displayName.value.trim(),username:f.username.value.trim(),password:f.password.value}});m.textContent='Owner account created. You can sign in now.';m.className='form-message success';setTimeout(()=>location.href='index.html',900)}catch(err){m.textContent=err.message;m.className='form-message error'}})</script></body></html>
